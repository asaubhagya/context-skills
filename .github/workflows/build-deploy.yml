name: Build + deploy (reusable)

# Reusable job: install → `pnpm check` (skills, manifest, channels — the strict
# gates) → `pnpm build-site` → Vercel production deploy. Called by
# deploy-site.yml and register-catalog.yml AFTER channels.yml has moved the
# latest/beta tags and committed channels.json, so the site always builds from
# a main whose tags and channels.json agree. Secrets come from the caller
# (`secrets: inherit`): VERCEL_ORG_ID, VERCEL_PROJECT_ID, VERCEL_TOKEN.
on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build (main = beta; every vN tag is read from history)
        type: string
        default: main

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build-site reads every tag; check-channels reads the moving tags
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build-site
      - run: pnpm check-site-links     # gate 3: every emitted link and redirect resolves

      # Without the token the build is still verified; the deploy is skipped
      # (not failed) and the summary says so. Add VERCEL_TOKEN as a repo secret
      # to turn this into a real deploy.
      - name: Deploy to Vercel (production)
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"

      # Runs only after a real deployment. Stable SHA is the package identity;
      # beta-only changes and reruns reuse the retained artifact.
      - name: Resolve stable plugin package
        if: env.VERCEL_TOKEN != ''
        id: plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE=$(python3 -c "import json; print(json.load(open('channels.json'))['latest']['sha'])")
          [[ "$STABLE" =~ ^[0-9a-f]{40}$ ]] || exit 1
          NAME="context-plugin-$STABLE"
          COUNT=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | length' | awk '{sum += $1} END {print sum+0}')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "needed=$([ "$COUNT" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Package stable Context skills
        if: steps.plugin.outputs.needed == 'true'
        run: pnpm package-context-plugin --out "$RUNNER_TEMP/context-plugin"

      - name: Store reviewer upload package
        if: steps.plugin.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plugin.outputs.name }}
          path: ${{ runner.temp }}/context-plugin/
          retention-days: 90
          if-no-files-found: error

      - name: Plugin handoff summary
        if: env.VERCEL_TOKEN != ''
        run: |
          echo "### Context plugin" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: ${{ steps.plugin.outputs.name }} (created this run: ${{ steps.plugin.outputs.needed }})." >> "$GITHUB_STEP_SUMMARY"
          echo "Download the retained Actions artifact, upload all skill ZIPs to the existing Context portal listing, scan and review, then submit. Publication after approval remains a portal operation; no supported public publishing API is configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          echo "### agents.onecontext.me" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$VERCEL_TOKEN" ]; then echo "> ⚠️ Built but **not deployed**: repo secret \`VERCEL_TOKEN\` is not set. Deploy by hand: \`pnpm build-site && vercel deploy site --prod\`." >> "$GITHUB_STEP_SUMMARY"; fi
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json; c=json.load(open('channels.json'))
          print(f"- latest: `{c['latest']['ref']}` ({c['latest']['sha'][:7]})  beta: `main@{c['beta']['sha'][:7]}`")
          print("- skills:", ", ".join(f"{k} v{v['latest']}" for k,v in c['skills'].items() if v['latest']))
          EOF
