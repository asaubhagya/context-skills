name: Build + deploy (reusable)

# Reusable job: install → `pnpm check` (skills, manifest, channels — the strict
# gates) → `pnpm build-site` → Vercel production deploy. Called by
# deploy-site.yml and register-catalog.yml AFTER channels.yml has moved the
# latest/beta tags and committed channels.json, so the site always builds from
# a main whose tags and channels.json agree. Secrets come from the caller
# (`secrets: inherit`): VERCEL_ORG_ID, VERCEL_PROJECT_ID, VERCEL_TOKEN.
on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build (main = beta; every vN tag is read from history)
        type: string
        default: main

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build-site reads every tag; check-channels reads the moving tags
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build-site

      # Without the token the build is still verified; the deploy is skipped
      # (not failed) and the summary says so. Add VERCEL_TOKEN as a repo secret
      # to turn this into a real deploy.
      - name: Deploy to Vercel (production)
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@latest deploy site --prod --yes --token "$VERCEL_TOKEN"

      - name: Summary
        run: |
          echo "### agents.onecontext.me" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$VERCEL_TOKEN" ]; then echo "> ⚠️ Built but **not deployed**: repo secret \`VERCEL_TOKEN\` is not set. Deploy by hand: \`pnpm build-site && vercel deploy site --prod\`." >> "$GITHUB_STEP_SUMMARY"; fi
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json; c=json.load(open('channels.json'))
          print(f"- latest: `{c['latest']['ref']}` ({c['latest']['sha'][:7]})  beta: `main@{c['beta']['sha'][:7]}`")
          print("- skills:", ", ".join(f"{k} v{v['latest']}" for k,v in c['skills'].items() if v['latest']))
          EOF
