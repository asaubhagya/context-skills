name: Deploy agents.onecontext.me

# main = beta channel, tags v* = latest. Either event first moves the
# latest/beta tags and commits channels.json (channels.yml), THEN rebuilds the
# whole site from git history and deploys it (build-deploy.yml). One workflow,
# `needs`-chained, so the site can never be built before the tags moved.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Queue rather than cancel: a cancelled run could stop between the tag push
# and the channels.json commit. register-catalog.yml shares this group.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  channels:
    uses: ./.github/workflows/channels.yml
    secrets: inherit

  deploy:
    needs: channels
    uses: ./.github/workflows/build-deploy.yml
    secrets: inherit
