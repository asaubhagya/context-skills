<!doctype html><meta charset=utf-8>
<!--
  motifs — the outline-sketch library for paper-cards (stroke #151515, width 2.6–3, fill none,
  round caps and joins). Copy an SVG into a slide's .sketch (one or two per slide, bottom third).
  Taken from the owner-approved Mac-launch carousel (2026-08-31); add new motifs in the same language.
  Open this file in a browser to see them side by side; it is never rendered as a slide.
-->
<style>body{background:#f5f5f3;padding:40px;font-family:ui-monospace,monospace;font-size:14px}figure{display:inline-block;margin:24px;vertical-align:bottom}figcaption{margin-top:8px}svg{overflow:visible}</style>
<body>

<figure><!-- phone: rounded rect, notch line, 4-bar waveform, record dot -->
<svg width="150" height="280" viewBox="0 0 150 280"><rect x="4" y="4" width="142" height="272" rx="26" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="55" y1="22" x2="95" y2="22" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="45" y1="130" x2="45" y2="160"/><line x1="65" y1="115" x2="65" y2="175"/><line x1="85" y1="100" x2="85" y2="190"/><line x1="105" y1="122" x2="105" y2="168"/></g><circle cx="75" cy="235" r="14" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75" cy="235" r="5" fill="#151515" stroke="none"/></svg>
<figcaption>phone</figcaption></figure>

<figure><!-- chat bubble with three typed lines (agent / MCP) -->

<figure><!-- sync arrows -->
<svg width="120" height="120" viewBox="0 0 120 120"><path d="M20 50 A40 40 0 0 1 95 40" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 40 l4 -16 M95 40 l-16 -2" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 70 A40 40 0 0 1 25 80" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 80 l-4 16 M25 80 l16 2" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

<figure><!-- crossed-out cloud: "nothing is uploaded" -->
<svg width="200" height="150" viewBox="0 0 200 150"><path d="M55 120 h95 a30 30 0 0 0 4 -60 a42 42 0 0 0 -80 -12 a32 32 0 0 0 -19 72 z" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="30" y1="135" x2="175" y2="20" stroke="#151515" stroke-width="3" stroke-linecap="round"/></svg>
<figcaption>cloud-crossed</figcaption></figure>

<figure><!-- two speakers + wave: speaker labels -->
<svg width="260" height="150" viewBox="0 0 260 150"><circle cx="40" cy="40" r="20" stroke="#151515" stroke-width="3" fill="none"/><path d="M6 110 a34 34 0 0 1 68 0" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="220" cy="40" r="20" stroke="#151515" stroke-width="3" fill="none"/><path d="M186 110 a34 34 0 0 1 68 0" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round"/><g stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round"><line x1="105" y1="70" x2="105" y2="90"/><line x1="120" y1="58" x2="120" y2="102"/><line x1="135" y1="48" x2="135" y2="112"/><line x1="150" y1="62" x2="150" y2="98"/><line x1="165" y1="72" x2="165" y2="88"/></g></svg>
<figcaption>speakers-wave</figcaption></figure>

<figure><!-- fn key + typed lines: one-key dictation on Mac -->
<svg width="260" height="130" viewBox="0 0 260 130"><rect x="4" y="30" width="90" height="90" rx="14" stroke="#151515" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="49" y="86" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="500" fill="#151515">fn</text><g stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round"><line x1="130" y1="50" x2="250" y2="50"/><line x1="130" y1="78" x2="220" y2="78"/><line x1="130" y1="106" x2="240" y2="106"/></g></svg>

<figure><!-- app glyph chips: Zoom · Meet · Teams · FaceTime · YouTube — copy the <span class="chip"> block -->
<div style="display:flex;gap:14px;flex-wrap:wrap;font-family:'IBM Plex Sans',sans-serif">
<span class="chip" style="border:2px solid rgba(21,21,21,.35);border-radius:999px;padding:10px 22px;font-size:24px;font-weight:600;color:#333"><svg width="30" height="30" viewBox="0 0 30 30" style="vertical-align:-6px;margin-right:9px"><rect x="2" y="7" width="17" height="16" rx="5" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 13 l8 -5 v14 l-8 -5 z" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Zoom</span>
<span class="chip" style="border:2px solid rgba(21,21,21,.35);border-radius:999px;padding:10px 22px;font-size:24px;font-weight:600;color:#333"><svg width="30" height="30" viewBox="0 0 30 30" style="vertical-align:-6px;margin-right:9px"><rect x="2" y="6" width="18" height="18" rx="4" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12 l8 -6 v18 l-8 -6 z" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 15 h8" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Meet</span>
<span class="chip" style="border:2px solid rgba(21,21,21,.35);border-radius:999px;padding:10px 22px;font-size:24px;font-weight:600;color:#333"><svg width="30" height="30" viewBox="0 0 30 30" style="vertical-align:-6px;margin-right:9px"><circle cx="11" cy="9" r="4.5" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 25 a8 8 0 0 1 16 0" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="11" r="3.5" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 25 a7 7 0 0 1 9 -6" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Teams</span>
<span class="chip" style="border:2px solid rgba(21,21,21,.35);border-radius:999px;padding:10px 22px;font-size:24px;font-weight:600;color:#333"><svg width="30" height="30" viewBox="0 0 30 30" style="vertical-align:-6px;margin-right:9px"><rect x="2" y="8" width="16" height="14" rx="6" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 13 l9 -4 v12 l-9 -4 z" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>FaceTime</span>
<span class="chip" style="border:2px solid rgba(21,21,21,.35);border-radius:999px;padding:10px 22px;font-size:24px;font-weight:600;color:#333"><svg width="30" height="30" viewBox="0 0 30 30" style="vertical-align:-6px;margin-right:9px"><rect x="2" y="7" width="26" height="17" rx="6" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 12 l7 3.5 l-7 3.5 z" stroke="#151515" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>YouTube</span>
</div>
