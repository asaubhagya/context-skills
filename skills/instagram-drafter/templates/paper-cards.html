<!doctype html><meta charset=utf-8>
<!--
  paper-cards — one Instagram slide, 1080×1350 (feed / carousel). Story = 1080×1920 (set body height).
  House style from the tenant's design tokens (design-guide .json): paper #f5f5f3, ink #151515,
  Space Grotesk display / IBM Plex Sans body, hairline rgba(21,21,21,.18), 5-bar mark in the footer.
  One slide = one HTML file = one PNG (scripts/render-cards.sh). Copy this file per slide, keep the
  <style>, fill the <body>. Motif SVGs: templates/motifs.html. Never edit the footer.

  Anatomy (top → bottom): .eyebrow (feature · Free / Pro subscription / Experimental tag)
  → h1 (value line, second clause in muted <em>) → .sub (≤ 2 plain sentences, value only)
  → optional .chips → .sketch (one or two outline motifs, bottom third) → optional .pill → .foot.
  Closing slide: <table> (columns iPhone · Mac · "Cloud bots" — never a competitor's name) + .pill CTA.
  Rules: "Pro subscription", never bare "Pro". Free claims match live entitlements. ≤ 10 slides.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@450;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#f5f5f3;color:#151515;font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;padding:88px 88px 80px;overflow:hidden}
.content{margin:auto 0}
.brand{display:flex;align-items:center;gap:20px;font-weight:700;font-size:42px;letter-spacing:-0.02em;font-family:'Space Grotesk',ui-sans-serif,sans-serif}
.bmark{display:inline-flex;align-items:center;gap:6px;color:#151515}
.bmark i{display:block;width:7px;border-radius:999px;background:currentColor}
.bmark i:nth-child(1),.bmark i:nth-child(5){height:20px}
.bmark i:nth-child(2),.bmark i:nth-child(4){height:38px}
.bmark i:nth-child(3){height:54px}
.eyebrow{font-size:24px;font-weight:800;letter-spacing:0.17em;text-transform:uppercase;color:#151515;margin-bottom:30px}
.eyebrow .tag{background:#151515;color:#f5f5f3;border-radius:8px;padding:4px 12px;margin-left:14px;letter-spacing:0.08em}
h1{font-family:'Space Grotesk',ui-sans-serif,sans-serif;font-weight:500;font-size:92px;letter-spacing:-0.045em;line-height:1.04;text-wrap:balance}
h1 em{font-style:normal;color:#626262}
.sub{font-size:31px;line-height:1.56;color:#4d4d4d;margin-top:34px;max-width:850px;font-weight:450}
.pill{display:inline-block;background:#151515;color:#fff;border-radius:999px;padding:18px 36px;font-size:27px;font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;padding-top:36px;border-top:1px solid rgba(21,21,21,.18)}
.foot span{font-size:25px;color:#626262;font-weight:700;letter-spacing:0.04em}
.sketch{margin-top:52px;display:flex;align-items:flex-end;gap:40px;color:#151515;opacity:.92}
.chips{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.chip{border:2px solid rgba(21,21,21,.35);border-radius:999px;padding:10px 22px;font-size:24px;font-weight:600;color:#333}
table{width:100%;border-collapse:collapse;margin-top:40px}
th,td{padding:17px 8px;border-bottom:1px solid rgba(21,21,21,.18);font-size:25px;text-align:center}
td:first-child,th:first-child{text-align:left;font-weight:600}
th{font-family:'Space Grotesk',ui-sans-serif,sans-serif;font-weight:700;font-size:26px}
th:last-child,td:last-child{color:#8a8a86}
.tick{font-size:26px}.beta{font-size:19px;color:#626262;font-weight:700;letter-spacing:.06em}.dash{color:#b9b9b5}
/* artifact card — "show the output" (a digest, notes, a spec) as the site does */
.artifact{margin-top:40px;background:#fff;border:1px solid rgba(21,21,21,.18);border-radius:6px;padding:34px 38px;box-shadow:18px 18px 0 #d9d9d5;max-width:880px}
.artifact .label{font-size:19px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:#626262;display:flex;justify-content:space-between}
.artifact ul{list-style:none;margin-top:22px}
.artifact li{font-size:27px;line-height:1.45;color:#151515;padding:12px 0;border-top:1px solid rgba(21,21,21,.12);display:flex;gap:22px;align-items:baseline}
.artifact li:first-child{border-top:0;padding-top:0}
.artifact li time{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:21px;color:#626262;white-space:nowrap;font-weight:500}
.artifact .note{margin-top:18px;font-size:19px;color:#8a8a86;font-style:italic}
svg{overflow:visible}
</style>
<body>
<div class="content">
  <div class="eyebrow">EYEBROW · FREE-OR-PRO TAG</div>
  <h1>Main value line. <em>Muted second clause.</em></h1>
  <div class="sub">One or two plain sentences of concrete value.</div>
  <div class="sketch"><!-- one or two motifs from templates/motifs.html --></div>
</div>
<div class="foot"><div class="brand"><span class="bmark"><i></i><i></i><i></i><i></i><i></i></span>Meetly</div><span>getmeetly.ai</span></div>
</body>
